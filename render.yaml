services:
  - type: web
    name: fitmentor-ai
    runtime: node
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
